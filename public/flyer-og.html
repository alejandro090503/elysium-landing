<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Elysium — OG preview · Mayo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Infant:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; }

    :root {
      /* 6-color premium palette */
      --pearl:     #FBF8F1;
      --ivory:     #EAE0CC;
      --champagne: #D4AF7F;
      --bronze:    #9B7B43;
      --espresso:  #2B1F14;
      --smoke:     #8B7E66;
    }

    body {
      font-family: 'Cormorant Infant', Georgia, serif;
      background:
        radial-gradient(circle at 100% 0%, rgba(212, 175, 127, 0.26), transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(155, 123, 67, 0.18), transparent 50%),
        linear-gradient(135deg, var(--ivory) 0%, var(--pearl) 50%, var(--ivory) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      top: -260px; right: -180px;
      width: 700px; height: 700px;
      background: rgba(212, 175, 127, 0.30);
    }
    body::after {
      bottom: -260px; left: -180px;
      width: 700px; height: 700px;
      background: rgba(155, 123, 67, 0.20);
    }

    .ribbon {
      width: 100%;
      background: var(--espresso);
      color: var(--pearl);
      padding: 14px 60px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-align: center;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      border-bottom: 1px solid var(--champagne);
    }
    .ribbon .dot {
      color: var(--champagne);
      font-size: 11px;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 30px 60px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-radius: 999px;
      background: var(--pearl);
      border: 1px solid var(--champagne);
      color: var(--bronze);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .badge::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--bronze);
    }

    .brand {
      font-family: 'Great Vibes', cursive;
      font-size: 232px;
      line-height: 1;
      background: linear-gradient(135deg, var(--champagne) 0%, var(--bronze) 50%, var(--espresso) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding: 12px 0;
      margin-top: -8px;
    }

    .tagline {
      font-size: 28px;
      color: var(--smoke);
      margin-top: 4px;
      font-weight: 400;
      font-style: italic;
    }

    .prices {
      margin-top: 22px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 18px;
    }

    .price-pill {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .price-pill .label {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .price-pill .strike {
      font-size: 16px;
      text-decoration: line-through;
      opacity: 0.65;
      font-weight: 500;
    }
    .price-pill .now {
      font-size: 24px;
      font-weight: 800;
    }

    .price-pill.basic {
      background: var(--pearl);
      color: var(--bronze);
      border: 1.5px solid var(--champagne);
      box-shadow: 0 8px 22px rgba(155, 123, 67, 0.16);
    }
    .price-pill.premium {
      background: linear-gradient(135deg, var(--champagne) 0%, var(--bronze) 100%);
      color: var(--pearl);
      box-shadow: 0 10px 26px rgba(43, 31, 20, 0.32);
    }

    .sep {
      align-self: center;
      color: var(--champagne);
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="ribbon">
    <span>Hot Sale</span>
    <span class="dot">◆</span>
    <span>21% OFF en ambos paquetes</span>
    <span class="dot">◆</span>
    <span>Hasta el 2 de junio</span>
  </div>

  <div class="content">
    <div class="badge">Hot Sale</div>
    <div class="brand">Elysium</div>
    <div class="tagline">Invitaciones que cuentan tu historia</div>
    <div class="prices">
      <span class="price-pill basic">
        <span class="label">Esencial</span>
        <span class="strike">$950</span>
        <span class="now">$750</span>
      </span>
      <span class="sep">◆</span>
      <span class="price-pill premium">
        <span class="label">Eterna</span>
        <span class="strike">$1,200</span>
        <span class="now">$950</span>
      </span>
    </div>
  </div>
</body>
</html>
