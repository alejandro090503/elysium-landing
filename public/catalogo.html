<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elysium · Portafolio de Invitaciones Digitales</title>
<meta name="description" content="Portafolio de Elysium: más de 170 invitaciones digitales entregadas a clientes satisfechos." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Elysium Invitaciones" />
<meta property="og:title" content="Portafolio · Elysium Invitaciones" />
<meta property="og:description" content="Más de 170 invitaciones entregadas a clientes satisfechos. Bodas, XV años y más." />
<meta property="og:image" content="https://elysium-landing-bice.vercel.app/preview-catalogo.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Portafolio de invitaciones digitales Elysium en un celular" />
<meta property="og:url" content="https://elysium-landing-bice.vercel.app/ver" />
<link rel="canonical" href="https://elysium-landing-bice.vercel.app/ver" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Portafolio · Elysium Invitaciones" />
<meta name="twitter:description" content="Más de 170 invitaciones entregadas a clientes satisfechos." />
<meta name="twitter:image" content="https://elysium-landing-bice.vercel.app/preview-catalogo.jpg" />
<meta name="theme-color" content="#FBF8F1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Infant:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pearl:#FBF8F1; --ivory:#EAE0CC; --champagne:#D4AF7F;
    --bronze:#9B7B43; --espresso:#2B1F14; --smoke:#8B7E66;
  }
  html { scroll-behavior: smooth; }
  html, body {
    background:
      radial-gradient(circle at 50% -8%, rgba(212,175,127,0.28), transparent 55%),
      linear-gradient(180deg, var(--ivory) 0%, var(--pearl) 40%);
    color: var(--espresso);
    font-family: 'Cormorant Infant', Georgia, serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    min-height: 100dvh;
  }

  header { text-align: center; padding: 34px 20px 6px; }
  .brand {
    font-family: 'Great Vibes', cursive; font-size: 72px; line-height: 1.05; padding-top: 10px;
    background: linear-gradient(135deg, var(--champagne), var(--bronze) 50%, var(--espresso));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.34em; text-transform: uppercase; color: var(--bronze); margin-top: 6px;
  }
  .sub { font-family:'Cormorant Infant',serif; font-style: italic; font-size: 18px; color: var(--smoke); margin-top: 8px; }

  .filters {
    display: inline-flex; background: #fff;
    border: 1px solid rgba(212,175,127,0.5); border-radius: 999px;
    padding: 4px; margin: 22px auto 4px;
    box-shadow: 0 6px 16px rgba(43,31,20,0.08);
  }
  .filters button {
    background: transparent; border: none; cursor: pointer;
    padding: 10px 20px; min-height: 44px;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--smoke);
    border-radius: 999px; transition: all 0.25s ease; -webkit-tap-highlight-color: transparent;
  }
  .filters button.active { background: linear-gradient(135deg, var(--champagne), var(--bronze)); color: #fff; box-shadow: 0 6px 14px rgba(155,123,67,0.4); }

  /* Coverflow 3D */
  .coverflow-wrap {
    position: relative; width: 100%; height: 560px; margin-top: 14px;
    perspective: 1500px; overflow: hidden;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .coverflow { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; transform-style: preserve-3d; }
  .card {
    position: absolute; left: 50%; top: 50%;
    width: 230px; height: 409px; margin-left: -115px; margin-top: -204px;
    border-radius: 20px; overflow: hidden; background: #fff;
    box-shadow: 0 22px 50px rgba(43,31,20,0.35);
    transition: transform 0.55s cubic-bezier(0.16,0.84,0.44,1), opacity 0.4s;
    transform-style: preserve-3d; will-change: transform;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .overlay {
    position: absolute; inset: auto 0 0 0; padding: 16px 14px 16px;
    background: linear-gradient(to top, rgba(43,31,20,0.88), transparent);
    color: #fff; text-align: center; opacity: 0; transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .card.active .overlay { opacity: 1; transform: translateY(0); }
  .card .title { font-family: 'Cormorant Infant', serif; font-size: 19px; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 9px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
  .card .open-btn {
    display: inline-block; background: var(--champagne); color: #2B1F14;
    padding: 10px 18px; border-radius: 999px; text-decoration: none;
    font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
  }

  .nav {
    display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 14px;
  }
  .nav button {
    background: #fff; border: 1px solid var(--champagne);
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    color: var(--bronze); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(43,31,20,0.10); transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .nav button:active { transform: scale(0.92); }
  .count { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--smoke); letter-spacing: 0.14em; min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
  .hint { text-align: center; font-family:'Inter',sans-serif; font-size: 11px; color: var(--smoke); letter-spacing: 0.16em; text-transform: uppercase; margin: 16px 0 8px; }
  .hint .hand { display: inline-block; animation: sw 1.8s ease-in-out infinite; }
  @keyframes sw { 0%,100% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }

  /* Promo + contador (WhatsApp) */
  .promo { text-align: center; padding: 30px 20px 4px; }
  .promo-shell { position: relative; display: inline-block; }
  /* anillos que salen del botón: dan la sensación de "tócame" */
  .promo-shell::before, .promo-shell::after {
    content: ''; position: absolute; inset: 0; border-radius: 999px;
    border: 2px solid rgba(37,211,102,0.55); pointer-events: none;
    animation: ripple 2.4s cubic-bezier(0.2,0.7,0.3,1) infinite;
  }
  .promo-shell::after { animation-delay: 1.2s; }
  @keyframes ripple {
    0%   { transform: scale(1);    opacity: 0.7; }
    100% { transform: scale(1.22); opacity: 0; }
  }

  .promo-btn {
    position: relative; overflow: hidden; z-index: 1;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 15px 20px 15px 24px; border-radius: 999px; text-decoration: none;
    background: linear-gradient(140deg, #2AE372, #25D366 42%, #12A150);
    box-shadow: 0 10px 26px rgba(18,140,80,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
    animation: breathe 2.4s ease-in-out infinite;
    transition: transform 0.16s cubic-bezier(0.2,0.8,0.3,1), box-shadow 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  /* destello que barre el botón */
  .promo-btn::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.42), transparent);
    transform: skewX(-18deg); animation: sweep 3.4s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 62% { left: -55%; }
    92%, 100% { left: 115%; }
  }
  .promo-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 16px 34px rgba(18,140,80,0.55); }
  .promo-btn:active { transform: scale(0.96); }

  .promo-wa { width: 27px; height: 27px; flex: none; fill: #fff; position: relative; z-index: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.22)); }
  .promo-label {
    position: relative; z-index: 1;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: #fff; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }
  .promo-timer {
    position: relative; z-index: 1;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 0.06em; color: #fff; font-variant-numeric: tabular-nums;
    background: rgba(4,60,32,0.32); border-radius: 999px; padding: 7px 13px;
  }
  .promo-note {
    font-family: 'Cormorant Infant', serif; font-style: italic;
    font-size: 16px; color: var(--smoke); margin-top: 14px;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 10px 26px rgba(18,140,80,0.45), inset 0 1px 0 rgba(255,255,255,0.35); }
    50%      { box-shadow: 0 12px 38px rgba(37,211,102,0.68), inset 0 1px 0 rgba(255,255,255,0.35); }
  }

  footer { text-align: center; padding: 20px 20px 40px; }
  footer a {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--bronze); text-decoration: none;
  }

  @media (max-width: 380px) {
    .brand { font-size: 60px; }
    .card { width: 205px; height: 364px; margin-left: -102px; margin-top: -182px; }
    .coverflow-wrap { height: 500px; }
  }
  @media (max-width: 420px) {
    .promo-btn { padding: 13px 13px 13px 16px; gap: 9px; }
    .promo-label { font-size: 10.5px; letter-spacing: 0.05em; }
    .promo-timer { font-size: 13px; padding: 6px 9px; }
    .promo-wa { width: 22px; height: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint .hand, .promo-btn, .promo-btn::after,
    .promo-shell::before, .promo-shell::after { animation: none; }
    .promo-btn::after { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Elysium</div>
  <div class="eyebrow">Portafolio de invitaciones</div>
  <div class="sub">Más de 170 invitaciones entregadas a clientes satisfechos</div>

  <div class="filters" id="filters" role="tablist">
    <button data-filter="boda" class="active" role="tab">Bodas</button>
    <button data-filter="xv" role="tab">XV Años</button>
    <button data-filter="cumple" role="tab">Otros</button>
  </div>
</header>

<div class="coverflow-wrap" id="coverflowWrap"><div class="coverflow" id="coverflow"></div></div>

<div class="nav">
  <button id="prev" aria-label="Anterior">‹</button>
  <span class="count" id="count">…</span>
  <button id="next" aria-label="Siguiente">›</button>
</div>
<div class="hint"><span class="hand">←</span> Desliza o toca una para abrirla <span class="hand">→</span></div>

<div class="promo">
  <span class="promo-shell">
    <a class="promo-btn" id="promoBtn" href="#" target="_blank" rel="noopener">
      <svg class="promo-wa" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47s1.06 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 2.5c-5.23 0-9.48 4.25-9.48 9.48 0 1.67.44 3.3 1.27 4.74L2.5 21.5l4.9-1.28a9.44 9.44 0 0 0 4.64 1.21h.01c5.23 0 9.48-4.25 9.48-9.48s-4.25-9.45-9.49-9.45zm0 17.35h-.01a7.87 7.87 0 0 1-4.01-1.1l-.29-.17-2.98.78.8-2.91-.19-.3a7.85 7.85 0 0 1-1.2-4.19c0-4.35 3.54-7.88 7.89-7.88 2.11 0 4.09.82 5.58 2.31a7.83 7.83 0 0 1 2.31 5.58c0 4.35-3.54 7.88-7.9 7.88z"/></svg>
      <span class="promo-label">Aprovecha la promoción</span>
      <span class="promo-timer" id="cdText">--:--:--</span>
    </a>
  </span>
  <div class="promo-note">Promoción válida hasta el 31 de agosto</div>
</div>

<footer>
  <a href="https://instagram.com/elysium.invitaciones" target="_blank" rel="noopener">@elysium.invitaciones</a>
</footer>

<script>
(async function(){
  const $ = id => document.getElementById(id)
  const vibrate = ms => { if (navigator.vibrate) navigator.vibrate(ms) }
  let catalog = []
  try { catalog = await (await fetch('/catalog.json?v=' + Date.now())).json() } catch(e){ console.error(e) }

  const coverflow = $('coverflow'), filters = $('filters'), countEl = $('count'), wrap = $('coverflowWrap')
  let currentFilter = 'boda', activeIdx = 0, items = []

  function applyFilter(){
    coverflow.innerHTML = ''
    items = catalog.filter(c => c.type === currentFilter)
    items.forEach(it => {
      const card = document.createElement('div')
      card.className = 'card'
      card.innerHTML = `<img src="${it.thumbnail}" alt="${it.title}" loading="lazy" /><div class="overlay"><div class="title">${it.title}</div><a class="open-btn" href="${it.url}" target="_blank" rel="noopener">Abrir invitación</a></div>`
      coverflow.appendChild(card)
    })
    activeIdx = 0; layout()
  }
  function layout(){
    const cards = coverflow.querySelectorAll('.card')
    cards.forEach((card,i) => {
      const off = i - activeIdx, abs = Math.abs(off)
      card.style.transform = `translate3d(${off*135}px,0,${-abs*130}px) rotateY(${-off*33}deg)`
      card.style.opacity = abs > 3 ? 0 : 1 - abs*0.17
      card.style.zIndex = 100 - abs
      card.classList.toggle('active', off === 0)
    })
    countEl.textContent = items.length ? `${activeIdx+1} / ${items.length}` : 'Sin resultados'
  }
  function go(d){ if(!items.length) return; const p = activeIdx; activeIdx = Math.max(0, Math.min(items.length-1, activeIdx+d)); if(activeIdx!==p) vibrate(10); layout() }

  filters.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    filters.querySelectorAll('button').forEach(b => b.classList.remove('active'))
    btn.classList.add('active'); currentFilter = btn.dataset.filter; applyFilter()
  }))
  $('prev').addEventListener('click', () => go(-1))
  $('next').addEventListener('click', () => go(1))

  coverflow.addEventListener('click', e => {
    const card = e.target.closest('.card'); if(!card) return
    const idx = [...coverflow.querySelectorAll('.card')].indexOf(card)
    if (idx === activeIdx) return
    e.preventDefault(); activeIdx = idx; layout()
  })

  let ds = null, dlck = false
  const start = x => { ds = x; dlck = false }
  const move = x => { if(ds===null||dlck) return; if(Math.abs(x-ds)>=30){ dlck = true; go(x<ds?1:-1) } }
  const end = () => { ds = null; dlck = false }
  wrap.addEventListener('pointerdown', e => { start(e.clientX); try{ wrap.setPointerCapture(e.pointerId) }catch{} })
  wrap.addEventListener('pointermove', e => move(e.clientX))
  wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end)
  wrap.addEventListener('touchstart', e => { if(e.touches.length===1) start(e.touches[0].clientX) }, { passive:true })
  wrap.addEventListener('touchmove', e => move(e.touches[0].clientX), { passive:true })
  wrap.addEventListener('touchend', end); wrap.addEventListener('touchcancel', end)
  document.addEventListener('keydown', e => { if(e.key==='ArrowLeft') go(-1); if(e.key==='ArrowRight') go(1) })

  applyFilter()

  // Promo: contador de 24h por visitante + WhatsApp
  const WA = '524421118867'
  const MSG = 'Hola, vi el catálogo de invitaciones y quiero aprovechar la promoción 😊'
  $('promoBtn').href = `https://wa.me/${WA}?text=${encodeURIComponent(MSG)}`
  $('promoBtn').addEventListener('click', () => vibrate(18))

  // Promoción con fecha fija: 31 de agosto de 2026, 23:59:59 (hora del centro de México)
  const FIN = new Date('2026-08-31T23:59:59-06:00').getTime()
  const pad = n => String(n).padStart(2, '0')
  function tick(){
    const left = FIN - Date.now()
    if (left <= 0){                       // terminada: se cae el contador, el botón se queda
      $('cdText').style.display = 'none'
      document.querySelector('.promo-note').textContent = 'Escríbenos por WhatsApp'
      return
    }
    const s = Math.floor(left / 1000), d = Math.floor(s / 86400)
    const hhmmss = `${pad(Math.floor(s / 3600) % 24)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`
    $('cdText').textContent = d > 0 ? `${d}d ${hhmmss}` : hhmmss
  }
  tick(); setInterval(tick, 1000)
})()
</script>
</body>
</html>
